[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amplitude-mcp-analytics"
version = "0.1.0"
description = "Amplitude MCP Analytics SDK - MCP server usage tracking for Amplitude Analytics"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Amplitude" }]
keywords = ["amplitude", "analytics", "mcp", "model-context-protocol"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
# Zero hard runtime dependencies, mirroring the Node SDK (where both the MCP SDK
# and the Amplitude client are peer dependencies). Coupling to the MCP SDK is
# structural/duck-typed; the Amplitude client is lazily imported only on the
# `api_key` path. Supported MCP SDK range: mcp>=1.16,<2 (see README).
dependencies = []

[project.optional-dependencies]
amplitude = ["amplitude-analytics>=1.2"]

[project.urls]
Repository = "https://github.com/amplitude/Amplitude-MCP-Analytics-Python"

[dependency-groups]
dev = [
  "mcp>=1.16,<2",
  "amplitude-analytics>=1.2",
  "anyio>=4.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pyright>=1.1.390",
  "ruff>=0.8.0",
]

[tool.uv]
exclude-newer = "7 days"

[tool.hatch.build.targets.wheel]
packages = ["src/amplitude_mcp_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Mirrors the Node repo's Biome setup: error-level correctness rules only,
# no formatter enforcement.
select = [
  "E4", "E7", "E9", # pycodestyle errors
  "F",              # pyflakes (unused imports/variables, use-before-def)
  "I",              # import sorting
  "UP",             # pyupgrade
  "B",              # bugbear
]
ignore = [
  "B008", # function call in default arg — common in typed APIs
]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
reportPrivateUsage = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportMissingTypeStubs = false
