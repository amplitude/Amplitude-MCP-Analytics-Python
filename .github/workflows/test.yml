name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # uv is installed from PyPI via the runner's Python (no third-party
      # setup action); uv then provisions the matrix interpreter itself.
      - name: Install uv
        run: python3 -m pip install --quiet uv

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Type check
        run: uv run pyright src

      - name: Test with coverage
        run: uv run pytest --cov=amplitude_mcp_analytics --cov-report=term --cov-report=xml -q

  # Exercise the v1 handler/context/run seams and v2 provisional middleware,
  # including real stdio and Streamable HTTP, against explicit SDK versions.
  sdk-compat:
    name: mcp SDK compat (${{ matrix.mcp-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcp-version: ["1.16.0", "1.30.0", "2.3.0"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        run: python3 -m pip install --quiet uv

      - name: Install dependencies
        run: uv sync --locked

      - name: Override mcp version
        run: uv pip install "mcp==${{ matrix.mcp-version }}"

      # Verify the override actually took — a resolver fallback that silently
      # reinstalled the locked version would make this whole job a no-op.
      - name: Verify override
        run: |
          INSTALLED=$(uv run --no-sync python -c "import importlib.metadata; print(importlib.metadata.version('mcp'))")
          echo "installed mcp==${INSTALLED}"
          if [ "$INSTALLED" != "${{ matrix.mcp-version }}" ]; then
            echo "override did not take (wanted ${{ matrix.mcp-version }})" >&2
            exit 1
          fi

      - name: Type check
        run: uv run --no-sync pyright src

      - name: Test (full suite)
        run: uv run --no-sync pytest -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        run: python3 -m pip install --quiet uv

      - name: Ruff
        run: uv run --locked ruff check src tests
