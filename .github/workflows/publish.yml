name: Publish to PyPI

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    # Only fire when the merged PR is a release PR opened by release.yml.
    # Checks both the title prefix and a marker phrase in the body — the
    # marker is what makes accidental/spoofed matches very unlikely.
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.title, 'chore(release): v') &&
      contains(github.event.pull_request.body, 'Automated release PR for')
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Install uv
        run: python3 -m pip install --quiet uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Type check
        run: uv run pyright src

      - name: Test with coverage
        run: uv run pytest --cov=amplitude_mcp_analytics -q

      - name: Build
        run: uv build

      - name: Read version
        id: version
        run: echo "version=v$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create + push tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag -a "$VERSION" -m "Release ${VERSION}"
          git push origin "$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$VERSION" --generate-notes --verify-tag

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish
