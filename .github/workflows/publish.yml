name: Publish to PyPI

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    # Only fire when the merged PR is a release PR opened by release.yml.
    #
    # The first two conditions are the authorization: PR title and body are
    # free text any contributor can copy, so on their own they let any merged
    # PR run this job with `contents: write` and the PyPI token. Author and
    # head branch are set by the forge, not the PR author:
    #   - release.yml runs `gh pr create` with the default GITHUB_TOKEN, so the
    #     PR is authored by the Actions bot (`github-actions[bot]`).
    #   - it pushes `release/v<version>` (BRANCH="release/${VERSION}", with
    #     VERSION="v$(uv version --short)") and opens the PR from that branch,
    #     so head.ref always starts with `release/v`. Opening a branch under
    #     that prefix requires push access to this repo, and authoring as the
    #     bot requires triggering release.yml itself (workflow_dispatch on
    #     main) — neither is available to an outside PR author.
    # Title and body checks stay as defense in depth.
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'release/v') &&
      startsWith(github.event.pull_request.title, 'chore(release): v') &&
      contains(github.event.pull_request.body, 'Automated release PR for')
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Install uv
        run: python3 -m pip install --quiet uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Type check
        run: uv run pyright src

      - name: Test with coverage
        run: uv run pytest --cov=amplitude_mcp_analytics -q

      - name: Build
        run: uv build

      - name: Read version
        id: version
        run: echo "version=v$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create + push tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag -a "$VERSION" -m "Release ${VERSION}"
          git push origin "$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$VERSION" --generate-notes --verify-tag

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish
