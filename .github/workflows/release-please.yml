name: release-please

# Releases are fully automated from conventional-commit history: release-please
# keeps a Release PR open against `main` (bumping `[project] version` in
# pyproject.toml and prepending to CHANGELOG.md), and merging that PR tags the
# release and publishes the built artifacts to PyPI.
#
# ---------------------------------------------------------------------------
# WHAT INFRA HAS TO PROVISION — NOTHING HERE IS SELF-CONFIGURING.
#
# REQUIRED to publish (the `publish` job fails without it):
#
#   1. A PyPI Trusted Publisher on the `amplitude-mcp-analytics` project:
#        owner:       amplitude
#        repository:  Amplitude-MCP-Analytics-Python
#        workflow:    release-please.yml     <- this file's name; renaming the
#                                              file breaks publishing
#        environment: pypi-release
#      The project has never been published, so this has to be created as a
#      PyPI *pending* publisher before the first release, then it converts to a
#      normal publisher on first upload. There is no PyPI API token anywhere in
#      this repo and none should be added.
#
#   2. A GitHub Actions environment named `pypi-release`. Both jobs run in it.
#      It must NOT carry a required-reviewer protection rule unless a human
#      approving every push to main is intended — the rule gates the
#      `release-please` job too, not just publishing.
#
# OPTIONAL, and only affects CI coverage on the Release PR:
#
#   3. Two secrets on the `pypi-release` environment (not repo- or org-level):
#        - AMPLITUDE_DEV_EXP_APP_ID
#        - AMPLITUDE_DEV_EXP_PRIVATE_KEY
#      Same GitHub App credentials Amplitude-TypeScript / developer-cli use on
#      their `npm-release` environment; infra copies them across. When they are
#      absent, release-please falls back to the default GITHUB_TOKEN — releases
#      still cut and still publish, but see the comment on the token step for
#      what is lost. Adding the secrets later needs no change to this file.
# ---------------------------------------------------------------------------

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write
  # OIDC token for PyPI Trusted Publishing (`uv publish`). Declared at the
  # workflow level because that is the scope uv's token exchange reads.
  id-token: write

# The job updates release-please's shared PR branch after creating it. Serialize
# pushes to main so two runs cannot race while regenerating and pushing uv.lock.
concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    # AMPLITUDE_DEV_EXP_* live on the pypi-release environment (mirroring
    # developer-cli's npm-release), not repo/org secrets.
    environment: pypi-release
    env:
      # Resolved here because a step-level `if:` cannot read the secrets
      # context, only the env one.
      HAS_APP_CREDENTIALS: ${{ secrets.AMPLITUDE_DEV_EXP_APP_ID != '' && secrets.AMPLITUDE_DEV_EXP_PRIVATE_KEY != '' }}
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      # Preferred path: a GitHub App installation token, so release-please's
      # PRs trigger downstream workflows. Events authored by the default
      # GITHUB_TOKEN do not start workflows, by design, which leaves test.yml
      # and semantic-pr.yml unrun on the Release PR.
      - uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e # v2.0.6
        id: app-token
        if: env.HAS_APP_CREDENTIALS == 'true'
        with:
          app-id: ${{ secrets.AMPLITUDE_DEV_EXP_APP_ID }}
          private-key: ${{ secrets.AMPLITUDE_DEV_EXP_PRIVATE_KEY }}

      - name: Note the GITHUB_TOKEN fallback
        if: env.HAS_APP_CREDENTIALS != 'true'
        run: |
          echo "::warning::AMPLITUDE_DEV_EXP_APP_ID / AMPLITUDE_DEV_EXP_PRIVATE_KEY are not set on the pypi-release environment; using GITHUB_TOKEN. Release PRs will not run test.yml or semantic-pr.yml — review them by hand. The publish job re-runs the full suite before uploading."

      # Falling back to GITHUB_TOKEN keeps releases flowing while the App
      # credentials are missing. `main` has no required status checks, so an
      # unchecked Release PR is reviewable and mergeable, and the publish job
      # below re-runs pyright and the test suite against the merged commit —
      # nothing untested reaches PyPI either way. The fallback does require
      # "Allow GitHub Actions to create and approve pull requests" to be
      # enabled for the repo; without it release-please cannot open its PR.
      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please updates pyproject.toml, but uv owns uv.lock. Refresh the
      # lockfile on the generated Release PR instead of teaching release-please
      # to edit uv's internal lockfile format directly.
      - name: Checkout the Release PR
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Install uv
        if: steps.release.outputs.prs_created == 'true'
        run: python3 -m pip install --quiet uv

      - name: Update the Release PR lockfile
        if: steps.release.outputs.prs_created == 'true'
        env:
          RELEASE_BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: |
          uv lock

          if git diff --quiet -- uv.lock; then
            echo "uv.lock is already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: update uv lockfile"
          git push origin "HEAD:${RELEASE_BRANCH}"

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-24.04
    needs: release-please
    # Only the push that merges a Release PR sets this; every other push to
    # main lands here as 'false' and the job is skipped.
    if: needs.release-please.outputs.releases_created == 'true'
    environment: pypi-release
    steps:
      - name: Checkout the repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      # uv is installed from PyPI via the runner's Python (no third-party setup
      # action), the same way test.yml does it.
      - name: Install uv
        run: python3 -m pip install --quiet uv

      - name: Install dependencies
        run: uv sync --locked

      # The same gates test.yml enforces on every PR, re-run against the merged
      # release commit: a red main must not reach PyPI, and unlike a tag push
      # this artifact cannot be replaced once uploaded.
      - name: Type check
        run: uv run pyright src

      - name: Test with coverage
        run: uv run pytest --cov=amplitude_mcp_analytics -q

      - name: Build the package
        run: uv build

      # Authenticates to PyPI via OIDC Trusted Publishing: `always` makes uv
      # exchange the workflow's id-token for a short-lived PyPI token and fail
      # loudly if that exchange is not available, rather than falling back to
      # an unauthenticated (or credential-scavenging) upload the way the
      # default `automatic` would. No UV_PUBLISH_TOKEN / PYPI_TOKEN exists.
      #
      # uv also uploads PEP 740 attestations for the wheel and sdist by
      # default under trusted publishing.
      #
      # pypa/gh-action-pypi-publish would do the same thing, but the org's
      # CI-pinning policy restricts third-party `uses:` lines and uv is already
      # this repo's only packaging tool.
      #
      # If this step fails because the Trusted Publisher is not configured yet,
      # the tag and GitHub release already exist: configure PyPI, then use
      # "Re-run failed jobs" on this run rather than cutting a second version.
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
