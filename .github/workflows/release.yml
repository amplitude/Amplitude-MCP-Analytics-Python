name: Open Release PR

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  open-release-pr:
    name: Open release PR
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true

      - name: Install uv
        run: python3 -m pip install --quiet uv

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version (no commit, no tag)
        id: bump
        env:
          VERSION_BUMP: ${{ inputs.version_bump }}
        run: |
          uv version --bump "$VERSION_BUMP"
          NEW_VERSION="v$(uv version --short)"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "branch=release/${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create branch, commit, push, open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          git checkout -b "$BRANCH"
          git commit -am "chore(release): ${VERSION}"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore(release): ${VERSION}" \
            --body "Automated release PR for ${VERSION}. Merging will trigger the publish workflow, which tags the commit and publishes to PyPI." \
            --base main \
            --head "$BRANCH"
